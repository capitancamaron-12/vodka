    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!descriptor) {
            descriptor = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          }
          if (descriptor && descriptor.get && !descriptor.set) {
            var activeFetch = originalFetch || (descriptor.get ? descriptor.get.call(window) : undefined);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
