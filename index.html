    <script>
      (function() {
        function makeWritable(obj, prop) {
          if (!obj) return;
          try {
            var currentVal = obj[prop];
            try {
              Object.defineProperty(obj, prop, {
                value: currentVal,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              var val = currentVal;
              Object.defineProperty(obj, prop, {
                get: function() { return val; },
                set: function(newVal) { val = newVal; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {}
        }

        function patchChain(target, prop) {
          if (!target) return;
          var curr = target;
          while (curr) {
            try {
              var desc = Object.getOwnPropertyDescriptor(curr, prop);
              if (desc && desc.get && !desc.set) {
                var fn = curr[prop];
                Object.defineProperty(curr, prop, {
                  get: function() { return fn; },
                  set: function(v) { fn = v; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
            try {
              curr = Object.getPrototypeOf(curr);
            } catch (e) {
              break;
            }
          }
          makeWritable(target, prop);
        }

        if (typeof window !== 'undefined') {
          patchChain(window, 'fetch');
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchChain(Window.prototype, 'fetch');
          }
        }
        if (typeof globalThis !== 'undefined') {
          patchChain(globalThis, 'fetch');
        }
        if (typeof self !== 'undefined') {
          patchChain(self, 'fetch');
        }
      })();
