<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vodka Mastery - Redirigiendo...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Auto-detect project repository segment on github.io vs custom domain
      (function() {
        var l = window.location;
        var isGitHubPages = l.hostname.indexOf('github.io') > -1;
        var segments = l.pathname.split('/').filter(Boolean);
        // If hosted on username.github.io/repo-name/, keep 1 segment (the repo name).
        // If hosted on a custom domain (e.g. example.com) or username.github.io root, keep 0.
        var pathSegmentsToKeep = (isGitHubPages && segments.length > 0) ? 1 : 0;

        var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var routePath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');

        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoPrefix + '/?/' +
          routePath.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;

        l.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0c0a09;
        color: #f5f5f4;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        padding: 2.5rem;
        background: #1c1917;
        border: 1px solid #292524;
        border-radius: 1.5rem;
        max-width: 420px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #f59e0b;
      }
      p {
        color: #a8a29e;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        background-color: #f59e0b;
        color: #0c0a09;
        font-weight: bold;
        text-decoration: none;
        border-radius: 0.75rem;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vodka Mastery</h1>
      <p>Cargando aplicación y redirigiendo a la sección solicitada...</p>
      <a href="./" id="home-link">Ir al Inicio</a>
    </div>
  </body>
</html>
